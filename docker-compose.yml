services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/hr_saas?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production"
      ENV: development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_schema.up.sql:/docker-entrypoint-initdb.d/001_schema.up.sql
      - ./backend/migrations/002_employee_salary.up.sql:/docker-entrypoint-initdb.d/002_employee_salary.up.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
